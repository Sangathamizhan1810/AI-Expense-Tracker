{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto var(--space-md); width: 48px; height: 48px; font-size: 1.5rem;">₹</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your ExpenseAI account to continue</p>
        </div>

        <form action="{{ url_for('auth.login', next=next) }}" method="POST" class="auth-form" novalidate>
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="name@example.com"
                    value="{{ email or '' }}"
                    required
                    autocomplete="email"
                    autofocus
                >
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-sm);">
                    <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                </div>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-xl);">
                <input type="checkbox" id="remember" name="remember" style="accent-color: var(--accent-start); width: 16px; height: 16px; cursor: pointer;">
                <label for="remember" style="font-size: var(--font-size-sm); color: var(--text-secondary); cursor: pointer; user-select: none;">
                    Remember me for 7 days
                </label>
            </div>

            <button type="submit" class="btn btn--primary btn--block btn--lg">
                <span>Sign In</span>
                <span aria-hidden="true">&rarr;</span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account yet?
            <a href="{{ url_for('auth.register') }}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
