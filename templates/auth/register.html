{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto var(--space-md); width: 48px; height: 48px; font-size: 1.5rem;">₹</div>
            <h1>Create Account</h1>
            <p>Join ExpenseAI to start managing your finances smartly</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form" novalidate>
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-input"
                    placeholder="e.g. John Doe"
                    value="{{ name or '' }}"
                    required
                    autocomplete="name"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="name@example.com"
                    value="{{ email or '' }}"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="At least 6 characters"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-input"
                    placeholder="Re-enter your password"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn--primary btn--block btn--lg" style="margin-top: var(--space-md);">
                <span>Create Account</span>
                <span aria-hidden="true">&rarr;</span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
